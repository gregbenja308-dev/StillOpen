[project]
name = "stillopen-api"
version = "0.1.0"
description = "Still Open FastAPI service. Runs on Cloud Run."
requires-python = ">=3.12"
dependencies = [
    "stillopen-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stillopen_api"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
