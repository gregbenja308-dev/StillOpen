[project]
name = "stillopen"
version = "0.1.0"
description = "Still Open — treat an open tab as unfinished business. Finish it or file it into Google."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Still Open" }]

dependencies = [
    "stillopen-core",
    "stillopen-api",
    "stillopen-jobs",
]

[project.optional-dependencies]
cloud = [
    "stillopen-core[cloud]",
]
adk = [
    "stillopen-core[adk]",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
    "cryptography>=43.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/api", "packages/core", "packages/jobs"]

[tool.uv.sources]
stillopen-core = { workspace = true }
stillopen-api = { workspace = true }
stillopen-jobs = { workspace = true }

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-markers", "--strict-config", "--tb=short"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["stillopen_core", "stillopen_api", "stillopen_jobs"]
mypy_path = "packages/core/src:packages/api/src:packages/jobs/src"

[tool.coverage.run]
source = ["packages"]
branch = true
omit = ["*/tests/*", "*/__init__.py"]
